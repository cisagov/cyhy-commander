[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cyhy-commander"
dynamic = ["version"]
requires-python = ">=3.14"
description = "CyHy Commander: job orchestration and scanner management"
license = { text = "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication" }
dependencies = [
    "beanie>=1.21.0",
    "cyhy-config @ git+https://github.com/cisagov/cyhy-config.git@v1",
    "cyhy-db @ git+https://github.com/cisagov/cyhy-db.git@v2",
    "cyhy-logging @ git+https://github.com/cisagov/cyhy-logging.git@v1",
    "defusedxml>=0.7.1",
    "lockfile==0.12.2",
    "motor>=3.6.0",
    "netaddr>=1.3.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pymongo>=4.10.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.scripts]
cyhy-commander = "cyhy_commander.commander:cli_entry"

[project.optional-dependencies]
test = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mongomock-motor>=0.0.21",
]
dev = [
    "black==24.4.2",
    "bandit[toml]==1.7.9",
    "flake8==7.1.0",
    "flake8-docstrings==1.7.0",
    "isort==5.13.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "pyupgrade==3.16.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cyhy_commander"]

[tool.hatch.build.targets.wheel.shared-data]
"cyhy_commander/jobs" = "cyhy_commander/jobs"

[tool.black]
line-length = 80
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 80

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false
no_implicit_optional = false
check_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flake8]
max-line-length = 80
# Select (turn on)
# * Complexity violations reported by mccabe (C)
# * Documentation conventions compliance reported by pydocstyle (D)
# * Default errors and warnings reported by pycodestyle (E and W)
# * Default errors reported by pyflakes (F)
# * Default warnings reported by flake8-bugbear (B)
# * The B950 flake8-bugbear opinionated warning
select = ["C", "D", "E", "F", "W", "B", "B950"]
# Ignore flake8's default warning about maximum line length (hard stop).
# Instead use flake8-bugbear's B950, which allows up to 10% overage.
# Also ignore W503 (line break before binary operator) — disagrees with PEP8.
extend-ignore = ["E501", "W503"]
# Test files don't need public method docstrings or worry about
# unused imports (fixtures) and line length in test data.
per-file-ignores = ["tests/*:B950,D102,D103,D401,D403"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.coverage.run]
source = ["cyhy_commander"]
omit = ["tests/*", "cyhy_commander/jobs/*"]

[tool.coverage.report]
fail_under = 80
