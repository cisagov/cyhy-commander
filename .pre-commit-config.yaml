---
ci:
  # Do not commit changes from running pre-commit for pull requests.
  autofix_prs: false
  # Autoupdate hooks weekly (this is the default).
  autoupdate_schedule: weekly

default_language_version:
  # force all unspecified python hooks to run python3
  python: python3

repos:
  # Check the pre-commit configuration
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: pretty-format-json
        args:
          - --autofix
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Text file hooks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args:
          - --config=.mdl_config.yaml
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.1
    hooks:
      - id: prettier
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --strict

  # GitHub Actions hooks
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.0
    hooks:
      - id: check-github-actions
      - id: check-github-workflows

  # pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit
    rev: v4.5.1
    hooks:
      - id: validate_manifest

  # Python hooks
  # Run bandit on the "tests" tree
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (tests tree)
        files: tests
        args:
          # Skip "assert used" check since assertions are used
          # frequently in pytests.
          # Skip subprocess and tmp directory checks since tests use
          # mocked subprocess and hardcoded paths safely.
          # Skip xml.sax checks since tests parse trusted test data.
          - --skip=B101,B108,B317,B404
  # Run bandit on everything except the "tests" tree
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (everything else)
        exclude: tests
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.3.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - dlint==0.16.0
          - flake8-bugbear==25.11.29
          - flake8-comprehensions==3.17.0
          - flake8-docstrings==1.7.0
          - flake8-noqa==1.5.0
          # This is necessary to read the flake8 configuration from
          # the pyproject.toml file.
          - flake8-pyproject==1.2.3
          - pep8-naming==0.15.1
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        # IMPORTANT: Keep type hinting-related dependencies of the
        # mypy pre-commit hook additional_dependencies in sync with
        # the dev section of pyproject.toml to avoid discrepancies in
        # type checking between environments.
        additional_dependencies:
          - beanie
          - hypothesis
          - mongomock-motor
          - motor
          - pydantic
          - pymongo
          - types-python-dateutil
          - types-PyYAML
          - types-requests
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        args:
          # We have to ignore this vulnerability for now since an
          # update for pygments has not yet been released.
          #
          # In any event, this vulnerability is unlikely to cause us
          # any problems since we don't feed any regexes to pygments
          # directly.  pygments is pulled in as a dependency of
          # pytest.
          #
          # See also:
          # - https://nvd.nist.gov/vuln/detail/CVE-2026-4539
          # - https://github.com/pygments/pygments/issues/3058
          #
          # TODO: Remove this when it becomes possible.  See
          # cisagov/skeleton-generic#257 for more details.
          - --ignore-vuln
          - CVE-2026-4539
          # urllib3 vulnerabilities exist only in pip-audit's own
          # pre-commit hook environment (2.6.3).  Our project pins
          # urllib3 2.7.0 via uv.lock which includes the fix.
          #
          # TODO: Remove these when the pip-audit hook updates its
          # urllib3 dependency.
          - --ignore-vuln
          - CVE-2026-44431
          - --ignore-vuln
          - CVE-2026-44432
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py314-plus

  # Docker hooks
  - repo: https://github.com/IamTheFij/docker-pre-commit
    rev: v3.0.1
    hooks:
      - id: docker-compose-check
